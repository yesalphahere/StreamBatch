<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117" />
      <stop offset="50%" stop-color="#161922" />
      <stop offset="100%" stop-color="#1a1c24" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078d4" />
      <stop offset="100%" stop-color="#00c0ff" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a8ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0078d4" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="12" />
  <rect x="0" y="316" width="1200" height="4" fill="url(#accentGrad)" />

  <!-- Subtle Grid Accent -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="320" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="500" y1="0" x2="500" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="700" y1="0" x2="700" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
    <line x1="900" y1="0" x2="900" y2="320" />
    <line x1="1000" y1="0" x2="1000" y2="320" />
    <line x1="1100" y1="0" x2="1100" y2="320" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
  </g>

  <!-- Glow effect -->
  <circle cx="1060" cy="120" r="140" fill="url(#glowGrad)" />

  <!-- Logo Mark -->
  <g transform="translate(80, 85)">
    <!-- StreamBatch Icon -->
    <rect x="0" y="0" width="80" height="80" rx="18" fill="#1e2330" stroke="#2d3748" stroke-width="2" />
    <circle cx="40" cy="40" r="28" fill="#13151b" />
    <!-- Down Arrow + Sound Waves -->
    <path d="M40 24 L40 46 M32 38 L40 46 L48 38" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M26 54 L54 54" stroke="#00a8ff" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Text Header -->
  <text x="185" y="130" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="-0.5">StreamBatch</text>
  <text x="185" y="165" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">Desktop Media Retrieval &amp; Batch Audio Transcoding Engine</text>

  <!-- Badges / Tags -->
  <g transform="translate(80, 215)">
    <!-- Tag 1: Python / Qt -->
    <rect x="0" y="0" width="130" height="28" rx="6" fill="#1a202c" stroke="#2d3748" />
    <text x="65" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">Python 3 + PySide6</text>

    <!-- Tag 2: yt-dlp & FFmpeg -->
    <rect x="140" y="0" width="135" height="28" rx="6" fill="#1a202c" stroke="#2d3748" />
    <text x="207" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">yt-dlp &amp; FFmpeg</text>

    <!-- Tag 3: SQLite WAL -->
    <rect x="285" y="0" width="115" height="28" rx="6" fill="#1a202c" stroke="#2d3748" />
    <text x="342" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">SQLite WAL DB</text>

    <!-- Tag 4: Manifest V3 -->
    <rect x="410" y="0" width="145" height="28" rx="6" fill="#1a202c" stroke="#2d3748" />
    <text x="482" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">Manifest V3 Extension</text>

    <!-- Tag 5: Zero Telemetry -->
    <rect x="565" y="0" width="125" height="28" rx="6" fill="#13271d" stroke="#166534" />
    <text x="627" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">100% Local Processing</text>
  </g>
</svg>
